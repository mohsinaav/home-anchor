<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver Handoff</title>
    <style>
        :root {
            --primary: #F59E0B;
            --primary-dark: #D97706;
            --bg: #FFFBEB;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-muted: #6B7280;
            --border: #FDE68A;
            --success: #10B981;
            --danger: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 50%, #FBBF24 100%);
            border-radius: 1rem;
            margin-bottom: 1rem;
        }

        .header__emoji {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .header__title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #92400E;
            margin-bottom: 0.25rem;
        }

        .header__subtitle {
            font-size: 0.875rem;
            color: #A16207;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 2px solid var(--border);
        }

        .card--important {
            border-color: var(--danger);
            background: #FEF2F2;
        }

        .important-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background: var(--danger);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .mood-section {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .mood-emoji {
            font-size: 4rem;
            line-height: 1;
        }

        .mood-label {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text);
            margin-top: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-item {
            background: #FEF9C3;
            padding: 1rem;
            border-radius: 0.75rem;
            text-align: center;
        }

        .stat-item__icon {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .stat-item__value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }

        .stat-item__label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .notes-section {
            background: #F9FAFB;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-top: 1rem;
        }

        .notes-section__title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .notes-section__content {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
        }

        .footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .footer__time {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            margin-bottom: 0.5rem;
        }

        .error-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .error-state__emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .error-state__title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .error-state__message {
            color: var(--text-muted);
        }

        .branding {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .branding a {
            color: var(--primary-dark);
            text-decoration: none;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1F2937;
                --card-bg: #374151;
                --text: #F9FAFB;
                --text-muted: #9CA3AF;
                --border: #4B5563;
            }

            .header {
                background: linear-gradient(135deg, #78350F 0%, #92400E 50%, #B45309 100%);
            }

            .header__title,
            .header__subtitle {
                color: #FEF3C7;
            }

            .stat-item {
                background: #4B5563;
            }

            .notes-section {
                background: #4B5563;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Content will be rendered by JavaScript -->
    </div>

    <script>
        const MOODS = ['Upset', 'Okay', 'Good', 'Happy', 'Amazing'];

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function decodeData() {
            try {
                const encoded = getUrlParam('data');
                if (!encoded) return null;
                const decoded = decodeURIComponent(atob(encoded));
                return JSON.parse(decoded);
            } catch (e) {
                console.error('Failed to decode data:', e);
                return null;
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown date';
            const [year, month, day] = dateStr.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            return date.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            const date = new Date(isoStr);
            return date.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        function render() {
            const app = document.getElementById('app');
            const data = decodeData();

            if (!data) {
                app.innerHTML = `
                    <div class="error-state">
                        <div class="error-state__emoji">😕</div>
                        <h2 class="error-state__title">Oops! Invalid Link</h2>
                        <p class="error-state__message">This handoff link appears to be invalid or expired. Please ask for a new link.</p>
                    </div>
                `;
                return;
            }

            const moodEmojis = ['😢', '😐', '🙂', '😄', '🤩'];
            const moodEmoji = moodEmojis[data.m || 2];
            const moodLabel = MOODS[data.m || 2];

            let statsHtml = '';
            if (data.mc > 0) {
                statsHtml += `
                    <div class="stat-item">
                        <div class="stat-item__icon">🍽️</div>
                        <div class="stat-item__value">${data.mc} meals</div>
                        <div class="stat-item__label">Today</div>
                    </div>
                `;
            }
            if (data.np) {
                statsHtml += `
                    <div class="stat-item">
                        <div class="stat-item__icon">😴</div>
                        <div class="stat-item__value">${escapeHtml(data.np)}</div>
                        <div class="stat-item__label">Nap</div>
                    </div>
                `;
            }
            if (data.dp) {
                statsHtml += `
                    <div class="stat-item">
                        <div class="stat-item__icon">🧷</div>
                        <div class="stat-item__value">${escapeHtml(data.dp)}</div>
                        <div class="stat-item__label">Last Diaper</div>
                    </div>
                `;
            }

            app.innerHTML = `
                <div class="header">
                    <div class="header__emoji">📋</div>
                    <h1 class="header__title">Handoff for ${escapeHtml(data.n)}</h1>
                    <p class="header__subtitle">${formatDate(data.d)}</p>
                </div>

                <div class="card ${data.im ? 'card--important' : ''}">
                    ${data.im ? '<div class="important-badge">⚠️ Important</div>' : ''}

                    <div class="mood-section">
                        <div class="mood-emoji">${moodEmoji}</div>
                        <div class="mood-label">${moodLabel}</div>
                    </div>

                    ${statsHtml ? `<div class="stats-grid">${statsHtml}</div>` : ''}

                    ${data.nt ? `
                        <div class="notes-section">
                            <div class="notes-section__title">📝 Notes</div>
                            <div class="notes-section__content">${escapeHtml(data.nt)}</div>
                        </div>
                    ` : ''}
                </div>

                <div class="footer">
                    ${data.ut ? `
                        <div class="footer__time">
                            🕐 Last updated: ${formatTime(data.ut)}
                        </div>
                    ` : ''}
                    <div class="branding">
                        Shared via Home Anchor
                    </div>
                </div>
            `;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Render on load
        render();
    </script>
</body>
</html>
